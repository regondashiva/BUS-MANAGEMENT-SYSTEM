services:
  - type: web
    name: bus-management-backend
    env: python
    region: oregon
    buildCommand: cd backend && ./build.sh
    startCommand: cd backend/travels && gunicorn travels.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: bus-management-db
          property: connectionString

databases:
  - name: bus-management-db
    region: oregon
    plan: free
